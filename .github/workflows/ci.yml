name: BookIt CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-report:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Устанавливаем pytest-cov отдельно
        pip install pytest-cov

    - name: Create .env file for Docker Compose
      run: |
        cat > .env << EOF
        DB_NAME=${{ secrets.DB_NAME }}
        DB_USER=${{ secrets.DB_USER }}
        DB_PASS=${{ secrets.DB_PASS }}
        DB_HOST=${{ secrets.DB_HOST }} 
        DB_TEST_HOST=${{ secrets.DB_TEST_HOST }} 
        DB_PORT=${{ secrets.DB_PORT }}
        BASE_URL_DIRECT=http://localhost:8000
        USE_CHARLES="false"
        EOF

    - name: Start Docker Compose
      run: docker compose up -d --build

    - name: Wait for services to be ready
      run: |
        echo "Waiting for API to be ready..."
        for i in {1..30}; do
          if curl -s http://localhost:8000/docs > /dev/null 2>&1; then
            echo "API is ready!"
            exit 0
          fi
          echo "Attempt $i: API not ready yet, waiting..."
          sleep 3
        done
        echo "API failed to start after 30 attempts"
        docker compose logs api
        exit 1

    - name: Run Pytest with Coverage and Allure
      run: |
        pytest tests/ --cov=app --cov-report=xml --alluredir=allure-results -v
      env:
        DB_NAME: ${{ secrets.DB_NAME }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_HOST: ${{ secrets.DB_HOST || 'db'}} 
        DB_TEST_HOST: ${{ secrets.DB_TEST_HOST || 'localhost'}} 
        DB_PORT: ${{ secrets.DB_PORT || '5432'}}
        BASE_URL_DIRECT: http://localhost:8000
        USE_CHARLES: "false"

    - name: Install Allure Commandline
      if: always()
      run: npm install -g allure-commandline

    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results --clean -o allure-report

    - name: Deploy Allure Report to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: allure-report
        keep_files: true
        force_orphan: true